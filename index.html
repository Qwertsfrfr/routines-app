<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Routines</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#000;--bg2:#0a0a0a;--bg3:#141414;--line:#1c1c1c;--line2:#2a2a2a;--fg:#ededed;--mut:#8f8f8f;--dim:#5c5c5c;--acc:#c8ef4f;--ink:#0a0a0a;--red:#f05252;
--body:Roboto,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
--e:cubic-bezier(.2,.8,.2,1);--d1:150ms;--d2:200ms;--d3:250ms}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);padding-top:env(safe-area-inset-top);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-variant-numeric:tabular-nums}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.mono,.lab,.sh,.stat,.tag,.rt,.tm{font-size:13px;font-weight:400;letter-spacing:0}
.mut{color:var(--mut)}.acc{color:var(--acc)}.dim{color:var(--dim)}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}
.ic{stroke-width:1.5}

main{position:relative;max-width:640px;margin:0 auto;padding:16px 20px calc(112px + env(safe-area-inset-bottom));view-transition-name:main}

/* entrances: gentle stagger */
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
.stg .r{animation:rise var(--d3) var(--e) both;animation-delay:calc(var(--i,0) * 25ms)}

/* today */
.top{display:flex;justify-content:space-between;align-items:center;padding-top:8px;color:var(--mut)}
.top .mono:first-child{color:var(--fg)}
.clock{display:flex;align-items:baseline;gap:6px;margin:24px 0 32px;line-height:1}
.clock .hm{font-size:min(20vw,96px);font-weight:200;letter-spacing:-.04em}
.clock .sec{font-size:15px;font-weight:400;color:var(--dim)}
.hero{position:relative;padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.lab{display:flex;align-items:center;gap:8px;color:var(--mut)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none}
.pulse.idle{background:var(--dim)}
.hrow{display:flex;align-items:center;gap:16px}
.title{font-size:22px;font-weight:500;line-height:1.2;letter-spacing:-.01em;margin:8px 0 4px;overflow-wrap:anywhere}
.cdw{margin-top:20px}
.cd{font-size:32px;font-weight:300;line-height:1;letter-spacing:-.02em}
.cdl{margin-top:4px}
.cta{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:20px;height:44px;padding:0 16px;border:0;border-radius:8px;background:var(--fg);color:var(--ink);font:500 14px var(--body);transition:transform var(--d1) var(--e),opacity var(--d1)}
.nx{display:flex;align-items:center;gap:12px;padding:16px 4px 0;color:var(--mut)}
.nxn{font-size:15px;color:var(--fg)}
.sh{display:flex;align-items:center;gap:8px;margin:40px 0 4px;color:var(--mut);font-size:13px}
.sh i{flex:1}
.sh span:last-child{color:var(--dim)}

/* ring */
.ringw{position:relative;flex:none;display:grid;place-items:center}
.ringw svg{transform:rotate(-90deg);display:block}
.ring .trk{stroke:var(--line2)}
.ring .bar{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset var(--d3) var(--e),stroke var(--d2)}
.stg .ring .bar,.fresh .ring .bar{animation:ringin var(--d3) var(--e) both 120ms}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}
.ringw .rt{position:absolute;font-size:12px;color:var(--fg)}
.ringw.win{animation:win var(--d3) var(--e)}
@keyframes win{50%{transform:scale(1.04)}}

/* rows */
.tr,.rr,.rmb,.trb{display:flex;align-items:center;gap:16px;width:100%;background:none;border:0;color:inherit;text-align:left;padding:0}
.tr,.rr{position:relative;padding:16px 0;border-bottom:1px solid var(--line);transition:transform var(--d1) var(--e),opacity var(--d2)}
.tr{padding:0;gap:8px}.trb{flex:1;min-width:0;padding:16px 0;transition:transform var(--d1) var(--e)}
.trb:active,.rr:active,.step:active,.rmb:active{transform:scale(.98)}
.tr .tm,.tr .mt,.tr .sq,.nmt{transition:opacity var(--d3) var(--e),color var(--d3) var(--e)}
.nmt{background:linear-gradient(var(--mut),var(--mut)) no-repeat 0 55%/0% 1px;transition:background-size var(--d3) var(--e),color var(--d3) var(--e)}
.tr.fin .nmt{background-size:100% 1px;color:var(--mut)}
.tr.fin .tm,.tr.fin .mt,.tr.fin .sq{opacity:.5}
.tdone{position:relative;width:44px;height:44px;flex:none;display:grid;place-items:center;margin-right:-8px;padding:0;border:0;background:none;color:var(--ink);transition:transform var(--d1) var(--e)}
.tdone>*{grid-area:1/1}
.tdone .ring .bar{stroke:var(--fg)}
.tr.now .tdone .ring .bar{stroke:var(--acc)}
.tdone .tfill{width:24px;height:24px;border-radius:50%;background:var(--acc);transform:scale(.6);opacity:0;transition:transform var(--d2) var(--e),opacity var(--d2) var(--e)}
.tdone>svg:not(.ring){position:relative;width:14px;height:14px}
.tdone>svg path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset var(--d2) var(--e)}
.tdone.on .tfill{transform:scale(1);opacity:1}
.tdone.on .ringw{opacity:0;transition:opacity var(--d2)}
.tdone.on>svg path{stroke-dashoffset:0;transition-delay:80ms;transition-duration:var(--d3)}
.tdone:active{transform:scale(.94)}
.gone{pointer-events:none}
.tr .tm{width:44px;flex:none;color:var(--mut)}
.nm{display:block;font-size:16px;font-weight:500;line-height:1.3}
.mt{display:block;margin-top:2px;color:var(--mut)}
.tr.now .tm{color:var(--fg)}
.tr.now::before{content:"";position:absolute;left:-12px;top:20px;bottom:20px;width:2px;border-radius:2px;background:var(--acc)}
.tr.past{opacity:.5}
.tag{display:inline-block;margin-left:8px;font-size:12px;color:var(--acc);vertical-align:1px}
.sq{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:10px;vertical-align:3px}
.idx{display:none}
.rtime{font-size:15px;color:var(--mut);align-self:flex-start;padding-top:1px}
.days{display:flex;gap:4px;margin-top:8px}
.days i{width:20px;height:20px;display:grid;place-items:center;border-radius:4px;font-size:11px;font-style:normal;color:var(--dim)}
.days i.on{background:var(--bg3);color:var(--fg)}
.rm{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);transition:opacity var(--d3) var(--e)}
.rm.on .nm{color:var(--mut)}
.ph{display:flex;align-items:baseline;gap:8px;margin:24px 0 16px}
.ph h1{margin:0;font-size:28px;font-weight:600;line-height:1.2;letter-spacing:-.02em}
.ph sup{font-size:15px;color:var(--dim);vertical-align:baseline}
.empty{padding:40px 0 16px}
.empty .eic{width:40px;height:40px;display:grid;place-items:center;margin-bottom:16px;border:1px solid var(--line2);border-radius:10px;color:var(--mut)}
.empty b{display:block;font-size:17px;font-weight:500}
.empty>span:not(.eic){display:block;margin-top:4px}
.empty .btn{margin-top:20px}
.empty.sm{padding:24px 0 8px}.empty.sm b{font-size:15px;color:var(--mut)}

/* checkbox */
.box{position:relative;width:22px;height:22px;flex:none;display:grid;place-items:center;padding:0;border-radius:6px;border:1.5px solid var(--line2);background:none;color:var(--ink);transition:transform var(--d1) var(--e),border-color var(--d2)}
.box::before{content:"";position:absolute;inset:-1.5px;border-radius:6px;background:var(--acc);opacity:0;transition:opacity var(--d2) var(--e)}
.box svg{position:relative;width:14px;height:14px}
.box path{fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset var(--d3) var(--e) 60ms}
.on>.box,.box.on{border-color:var(--acc)}
.on>.box::before,.box.on::before{opacity:1}
.on>.box path,.box.on path{stroke-dashoffset:0}
.box:active{transform:scale(.94)}
button.box::after{content:"";position:absolute;inset:-10px}
.pop>.box,.box.pop,.tdone.pop{animation:pop var(--d3) var(--e)}
@keyframes pop{0%{transform:scale(.94)}100%{transform:scale(1)}}
.step{display:flex;gap:16px;align-items:center;width:100%;min-height:56px;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;text-align:left;font:400 15px/1.4 var(--body);transition:transform var(--d1) var(--e)}
.step>.mono{color:var(--dim)}
.tx{transition:color var(--d3) var(--e)}.step.on .tx{color:var(--mut)}
.tx>span{position:relative}
.tx>span::after{content:"";position:absolute;left:0;right:0;top:55%;height:1px;background:var(--mut);transform:scaleX(0);transform-origin:left;transition:transform var(--d3) var(--e)}
.step.on .tx>span::after{transform:scaleX(1)}
.fresh .step{animation:rise var(--d3) var(--e) both;animation-delay:calc(var(--i,0) * 25ms + 80ms)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(0,0,0,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);view-transition-name:nav}
nav button{position:relative;height:60px;border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 11px var(--body);transition:color var(--d2) var(--e)}
nav button .ic{width:20px;height:20px;transition:transform var(--d1) var(--e)}
nav button:active .ic{transform:scale(.94)}
nav button.on{color:var(--fg)}
nav .ind{position:absolute;top:-1px;left:0;width:25%;height:1px;display:flex;justify-content:center;transform:translateX(calc(var(--k,0) * 100%));transition:transform var(--d3) var(--e)}
nav .ind::before{content:"";width:24px;height:1px;background:var(--acc)}
.fab{position:fixed;right:20px;bottom:calc(76px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:12px;border:0;background:var(--fg);color:var(--ink);display:grid;place-items:center;z-index:4;transform:translateY(8px);opacity:0;pointer-events:none;transition:transform var(--d2) var(--e),opacity var(--d2) var(--e)}
.fab .ic{width:22px;height:22px}
.fab.show{transform:none;opacity:1;pointer-events:auto}
.fab.show:active{transform:scale(.96)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;opacity:0;pointer-events:none;transition:opacity var(--d3) var(--e)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:90vh;overflow:auto;overscroll-behavior:contain;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding:0 20px calc(24px + env(safe-area-inset-bottom));z-index:11;transform:translateY(105%);transition:transform var(--d2) var(--e);box-shadow:0 90px 0 var(--bg2)}
.sheet.open{transform:translateY(0);transition:transform var(--d3) var(--e)}
.sheet.drag{transition:none}
.grab{height:24px;display:grid;place-items:center;position:sticky;top:0;margin:0 -20px;background:var(--bg2);z-index:2}
.grab i{width:32px;height:4px;border-radius:4px;background:var(--line2)}
.swap{animation:rise var(--d2) var(--e) both}
.ck-head{display:flex;align-items:center;gap:16px;padding:8px 0 16px;border-bottom:1px solid var(--line)}
.ck-title,.sh-title{font-size:22px;font-weight:500;line-height:1.2;letter-spacing:-.01em;margin-top:4px;overflow-wrap:anywhere}
.sh-title{margin-bottom:8px}
.acts{display:flex;gap:8px;margin-top:24px}
label{display:block;color:var(--mut);margin:20px 0 8px;font-size:13px}
input[type=text],input[type=time],input[type=number],input[type=datetime-local]{width:100%;height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--fg);font:400 15px var(--body);color-scheme:dark;transition:border-color var(--d2) var(--e)}
input:focus{outline:none;border-color:#555}
input::placeholder{color:var(--dim)}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.chip{height:40px;border-radius:8px;border:1px solid var(--line2);background:none;color:var(--mut);font:500 13px var(--body);transition:transform var(--d1) var(--e),color var(--d2) var(--e),background-color var(--d2) var(--e),border-color var(--d2) var(--e)}
.chip.on{color:var(--ink);background:var(--fg);border-color:var(--fg)}
.sws{display:flex;gap:12px;flex-wrap:wrap}
.sw{position:relative;width:28px;height:28px;border-radius:50%;border:0;padding:0;transition:transform var(--d1) var(--e)}
.sw::after{content:"";position:absolute;inset:-5px;border:1.5px solid var(--fg);border-radius:50%;opacity:0;transition:opacity var(--d2) var(--e)}
.sw.on::after{opacity:1}
.srow{gap:8px;margin-bottom:8px}.srow input[type=text]{flex:1;min-width:0}.srow input[type=number]{flex:none}.sn{width:20px;flex:none;color:var(--dim)}
.btn{height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:none;font:500 14px var(--body);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform var(--d1) var(--e),background-color var(--d2) var(--e)}
.btn .ic{width:16px;height:16px}
.btn.pri{background:var(--fg);border-color:var(--fg);color:var(--ink)}
.btn.dan{color:var(--red);border-color:#3a1c1c}
.btn.red{background:var(--red);border-color:var(--red);color:#000}
.btn.full{width:100%}.btn:disabled{opacity:.4}
.btn:active,.chip:active,.sw:active,.cta:active,.x:active{transform:scale(.98)}
.x{width:40px;height:44px;flex:none;border:0;background:none;color:var(--dim);display:grid;place-items:center;transition:transform var(--d1) var(--e)}
.set{border-top:1px solid var(--line);padding:20px 0}
.set .k{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.set .k .mono:first-child{font-size:15px;font-weight:500}
.stat{padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--mut);font-size:12px}
.stat.ok{color:var(--acc);border-color:rgba(200,239,79,.3)}
.note{font-size:14px;line-height:1.5;color:var(--mut);margin:0 0 16px}

/* dialog */
.dscrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity var(--d2) var(--e)}
.dscrim.open{opacity:1;pointer-events:auto}
.dlg{position:fixed;left:16px;right:16px;top:50%;z-index:21;max-width:400px;margin:0 auto;padding:20px;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;opacity:0;pointer-events:none;transform:translateY(-50%) scale(.98);transition:transform var(--d1) var(--e),opacity var(--d1) var(--e)}
.dlg.open{opacity:1;pointer-events:auto;transform:translateY(-50%);transition:transform var(--d2) var(--e),opacity var(--d2) var(--e)}
.dlg .dk{display:none}
.dlg .dt{font-size:17px;font-weight:600;line-height:1.3;margin:0 0 8px;overflow-wrap:anywhere}
.dlg .note{margin:0}
.dlg .acts{margin-top:20px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;max-width:400px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;background:var(--bg3);border:1px solid var(--line2);border-radius:12px;font:400 14px var(--body);color:var(--fg);opacity:0;transform:translateY(8px);transition:opacity var(--d2) var(--e),transform var(--d2) var(--e);pointer-events:none}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast span{flex:1}.toast .btn{height:36px;padding:0 12px;font-size:13px}

/* view transitions: soft crossfade + small translate */
::view-transition-old(root){display:none}
::view-transition-new(root){animation:none}
::view-transition-old(nav){display:none}
::view-transition-new(nav){animation:none}
::view-transition-group(main){animation-duration:var(--d3);animation-timing-function:var(--e)}
::view-transition-old(main){animation:vtOut var(--d1) var(--e) both}
::view-transition-new(main){animation:vtIn var(--d3) var(--e) both}
html[data-dir=back]::view-transition-old(main){animation-name:vtOutB}
html[data-dir=back]::view-transition-new(main){animation-name:vtInB}
@keyframes vtOut{to{opacity:0;transform:translateX(-6px)}}
@keyframes vtIn{from{opacity:0;transform:translateX(6px)}}
@keyframes vtOutB{to{opacity:0;transform:translateX(6px)}}
@keyframes vtInB{from{opacity:0;transform:translateX(-6px)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<main id="main"></main>
<button class="fab" id="fab" aria-label="Add"></button>
<nav id="nav"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="dscrim" id="dscrim"></div>
<div class="dlg" id="dlg" role="alertdialog" aria-modal="true"></div>
<script>
'use strict';
const KEY = 'routines-data-v1', FIRED = 'routines-fired-v1';
const COLORS = ['#d4ff3a','#ffffff','#2f6bff','#ff3d6e','#00e5c3','#ffb21a','#8c8c8c'];
const DAYN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], ORDER = [1,2,3,4,5,6,0];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const uid = () => Math.random().toString(36).slice(2, 10);
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const mins = t => { const [h, m] = (t || '0:0').split(':').map(Number); return h * 60 + m; };
function fmtCD(sec) {
  sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s);
}

/* ---------- storage ---------- */
function seed() {
  const st = (t, m) => ({ id: uid(), text: t, mins: m || 0 });
  return {
    routines: [
      { id: uid(), name: 'Morning', emoji: '\u{1F305}', color: COLORS[2], time: '07:00', days: [0,1,2,3,4,5,6], steps: [st('Drink a glass of water', 2), st('Stretch', 5), st('Shower', 10), st('Breakfast', 15), st('Plan the day', 5)] },
      { id: uid(), name: 'Gym', emoji: '\u{1F3CB}️', color: COLORS[0], time: '18:00', days: [1,3,5], steps: [st('Pack gym bag', 5), st('Warm up', 10), st('Main lifts', 40), st('Cool down', 10), st('Protein shake', 5)] },
      { id: uid(), name: 'Wind down', emoji: '\u{1F319}', color: COLORS[4], time: '22:00', days: [0,1,2,3,4,5,6], steps: [st('Phone on charger', 1), st("Prep tomorrow's clothes", 5), st('Brush teeth', 3), st('Read', 20)] }
    ],
    reminders: [], ticks: { date: dstr(new Date()), map: {} }
  };
}
let data, saveFailed = false;
function load() {
  try { const r = localStorage.getItem(KEY); if (r) data = JSON.parse(r); } catch (e) { data = null; }
  if (!data || !Array.isArray(data.routines)) { data = seed(); save(); }
  data.reminders = data.reminders || []; data.ticks = data.ticks || { date: '', map: {} };
  rollDay();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { saveFailed = true; } try { clearTimeout(window._rs); window._rs = setTimeout(() => { scheduleTriggers(); }, 400); } catch (e) {} }
function rollDay() { const t = dstr(new Date()); if (data.ticks.date !== t) { data.ticks = { date: t, map: {} }; save(); } }
function getFired() { try { return JSON.parse(localStorage.getItem(FIRED) || '{}'); } catch (e) { return {}; } }
function setFired(f) { try { localStorage.setItem(FIRED, JSON.stringify(f)); } catch (e) {} }

/* ---------- schedule helpers ---------- */
function routineDur(r) { const s = r.steps.reduce((a, x) => a + (+x.mins || 0), 0); return s || 30; }
function todaysRoutines() {
  const d = new Date().getDay();
  return data.routines.filter(r => r.days.includes(d)).sort((a, b) => mins(a.time) - mins(b.time));
}
function progress(r) { const t = data.ticks.map[r.id] || []; return [r.steps.filter(s => t.includes(s.id)).length, r.steps.length]; }
function nowNext() {
  const now = new Date(), nm = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;

  const t = data.ticks.map[id] || [], [a, b] = progress(r);
  openSheet(`<div class="ck-head"><div class="grow"><div class="mono mut">${r.time} · ${routineDur(r)} min</div><div class="ck-title">${esc(r.name)}</div></div>
   <div class="ringw" id="ckring">${ring(a, b, 52, 3)}<span class="rt" id="ckcount">${b && a === b ? 'Done' : a + '/' + b}</span></div></div><div>` +
   (r.steps.length ? r.steps.map((s, i) => `<button class="step ${t.includes(s.id) ? 'on' : ''}" style="--i:${i}" data-tick="${r.id}|${s.id}"><span class="box">${CHECK}</span><span class="tx grow"><span>${esc(s.text)}</span></span>${+s.mins ? `<span class="mono mut">${+s.mins}m</span>` : ''}</button>`).join('') : '<div class="empty sm"><b>No steps yet</b><span class="mono mut">Tap Edit to add some</span></div>') +
   `</div><div class="acts"><button class="btn" data-edit="${r.id}">${ic('edit', 18)}Edit</button><button class="btn pri grow" data-close>Done</button></div>`);
}
let form = null;
function routineForm(id) {
  const ex = data.routines.find(x => x.id === id);
  form = ex ? JSON.parse(JSON.stringify(ex)) : { id: uid(), name: '', emoji: '', color: COLORS[0], time: '08:00', days: [1,2,3,4,5], steps: [] };
  form.kind = 'rt'; form.isNew = !ex; drawRoutineForm();
}
function drawRoutineForm(quiet) {
  const f = form;
  openSheet(`<div class="mono mut">${f.isNew ? 'New routine' : 'Edit routine'}</div><div class="sh-title">${esc(f.name) || 'Untitled'}</div>
  <label for="f-name">Name</label><input type="text" id="f-name" value="${esc(f.name)}" placeholder="Morning" autocomplete="off">
  <div class="row"><div class="grow"><label for="f-time">Start</label><input type="time" id="f-time" value="${esc(f.time)}"></div><div style="width:118px"><label for="f-emoji">Notif. emoji</label><input type="text" id="f-emoji" value="${esc(f.emoji)}" maxlength="4"></div></div>
  <label>Repeats</label><div class="days7">${ORDER.map(d => `<button type="button" class="chip ${f.days.includes(d) ? 'on' : ''}" data-day="${d}"><span>${DAYN[d].slice(0, 2)}</span></button>`).join('')}</div>
  <label>Colour</label><div class="sws">${COLORS.map(c => `<button type="button" class="sw ${f.color === c ? 'on' : ''}" style="background:${c}" data-color="${c}" aria-label="colour"></button>`).join('')}</div>
  <label>Steps · minutes optional</label><div>${f.steps.map((s, i) => `<div class="row srow"><span class="mono sn">${pad(i + 1)}</span><input type="text" data-st="${i}" value="${esc(s.text)}" placeholder="Step"><input type="number" inputmode="numeric" min="0" data-sm="${i}" value="${+s.mins || ''}" placeholder="min" style="width:76px"><button class="x" data-rmstep="${i}" aria-label="Remove">${ic('x', 18)}</button></div>`).join('')}</div>
  <button type="button" class="btn full" data-addstep>${ic('plus', 18)}Add step</button>
  <div class="acts">${f.isNew ? '' : '<button class="btn dan" data-delr>Delete</button>'}<button class="btn grow" data-close>Cancel</button><button class="btn pri grow" data-saver>Save</button></div>`, quiet);
}
function syncRoutineForm() {
  if (!form || form.kind !== 'rt') return;
  const g = i => document.getElementById(i);
  form.name = g('f-name').value; form.time = g('f-time').value || '08:00'; form.emoji = g('f-emoji').value;
  document.querySelectorAll('[data-st]').forEach(e => { form.steps[+e.dataset.st].text = e.value; });
  document.querySelectorAll('[data-sm]').forEach(e => { form.steps[+e.dataset.sm].mins = +e.value || 0; });
}
function reminderForm(id) {
  const ex = data.reminders.find(x => x.id === id), d = new Date(Date.now() + 3600000);
  const def = dstr(d) + 'T' + pad(d.getHours()) + ':00';
  form = { kind: 'rem', id: ex ? ex.id : uid() };
  openSheet(`<div class="mono mut">${ex ? 'Edit reminder' : 'New reminder'}</div><div class="sh-title">${ex ? esc(ex.title) : 'Remind me'}</div>
  <label for="m-title">Title</label><input type="text" id="m-title" value="${esc(ex ? ex.title : '')}" placeholder="Call the dentist" autocomplete="off">
  <label for="m-at">Date and time</label><input type="datetime-local" id="m-at" value="${esc(ex ? ex.at : def)}">
  <div class="acts">${ex ? '<button class="btn dan" data-delm>Delete</button>' : ''}<button class="btn grow" data-close>Cancel</button><button class="btn pri grow" data-savem>Save</button></div>`);
}

/* drag-to-dismiss */
(function () {
  const s = $('#sheet'), sc = $('#scrim'); let dg = null;
  s.addEventListener('touchstart', e => {
    if (e.target.closest('input,select,textarea')) { dg = null; return; }
    dg = { y0: e.touches[0].clientY, t0: performance.now(), dy: 0, on: false, ok: s.scrollTop <= 0 || !!e.target.closest('.grab') };
  }, { passive: true });
  s.addEventListener('touchmove', e => {
    if (!dg) return;
    const dy = e.touches[0].clientY - dg.y0;
    if (!dg.on) {
      if (dy > 8 && dg.ok) { dg.on = true; dg.y0 += 8; s.classList.add('drag'); }
      else if (Math.abs(dy) > 8) { dg = null; return; } else return;
    }
    e.preventDefault();
    const d = e.touches[0].clientY - dg.y0; dg.dy = Math.max(0, d);
    s.style.transform = `translateY(${d < 0 ? d * .2 : d}px)`;
    sc.style.opacity = 1 - Math.min(1, dg.dy / s.offsetHeight);
  }, { passive: false });
  const end = () => {
    if (!dg) return; const d = dg; dg = null; if (!d.on) return;
    s.classList.remove('drag'); s.style.transform = ''; sc.style.opacity = '';
    const v = d.dy / Math.max(1, performance.now() - d.t0);
    if (d.dy > s.offsetHeight * .25 || v > .6) { buzz(8); closeSheet(); }
  };
  s.addEventListener('touchend', end); s.addEventListener('touchcancel', end);
})();
document.addEventListener('touchstart', () => {}, { passive: true }); // enables :active on mobile

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button, #scrim, #dscrim'); if (!t) return;
  const D = t.dataset;
  if (t.tagName === 'BUTTON' && !D.rall) buzz(10);
  if (t.id === 'dscrim' || 'dno' in D) { closeDialog(false); return; }
  if ('dok' in D) { closeDialog(true); return; }
  if (t.id === 'scrim' || 'close' in D) { closeSheet(); return; }
  if (D.new) { D.new === 'rt' ? routineForm() : reminderForm(); return; }
  if (D.rall) {
    const r = data.routines.find(x => x.id === D.rall); if (!r) return;
    const [a, b] = progress(r), row = t.closest('.tr');
    if (!b) { buzz(6); row.animate && row.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }], { duration: 260 }); return; }
    const done = a !== b;                                // true = marking done
    data.ticks.map[r.id] = done ? r.steps.map(s => s.id) : []; save();
    row.classList.toggle('fin', done); if (done) row.classList.remove('past');
    t.classList.toggle('on', done); t.setAttribute('aria-label', done ? 'Mark not done' : 'Mark done');
    setRing(t.querySelector('svg.ring'), done ? b : 0, b);
    const mt = row.querySelector('.mt'); if (mt) mt.textContent = (done ? b : 0) + '/' + b + ' steps · ' + routineDur(r) + ' min';
    t.classList.remove('pop');
    if (done) { void t.offsetWidth; t.classList.add('pop'); buzz(8); } else buzz(8);
    clearTimeout(window._rd); window._rd = setTimeout(() => { if (!sheetOpen() && tab === 'today') render(); }, 1100); return;
  }
  if (D.tab) { go(D.tab); return; }
  if (t.id === 'fab') { tab === 'routines' ? routineForm() : reminderForm(); return; }
  if (D.open) { openChecklist(D.open); return; }
  if (D.edit) { routineForm(D.edit); return; }
  if (D.redit) { reminderForm(D.redit); return; }
  if (D.tick) {
    const [rid, sid] = D.tick.split('|'); const a = data.ticks.map[rid] = data.ticks.map[rid] || [];
    const i = a.indexOf(sid); i < 0 ? a.push(sid) : a.splice(i, 1); save();
    const r = data.routines.find(x => x.id === rid), on = i < 0, [x, y] = progress(r);
    t.classList.toggle('on', on); t.classList.remove('pop'); if (on) { void t.offsetWidth; t.classList.add('pop'); }
    const rw = $('#ckring');
    if (rw) { setRing(rw.querySelector('svg'), x, y); $('#ckcount').textContent = y && x === y ? 'Done' : x + '/' + y; }
    if (on && y && x === y) { buzz([12, 60, 30]); if (rw) { rw.classList.remove('win'); void rw.offsetWidth; rw.classList.add('win'); } }
    render(); return;
  }
  if (D.rdone) {
    const m = data.reminders.find(x => x.id === D.rdone); m.done = !m.done; save(); scheduleTriggers();
    t.classList.toggle('on', m.done); t.parentElement.classList.toggle('on', m.done);
    t.classList.remove('pop'); if (m.done) { void t.offsetWidth; t.classList.add('pop'); }
    clearTimeout(window._rd); window._rd = setTimeout(() => { if (!sheetOpen()) render(); }, 650); return;
  }
  if (D.day != null) { syncRoutineForm(); const d = +D.day, i = form.days.indexOf(d); i < 0 ? form.days.push(d) : form.days.splice(i, 1); t.classList.toggle('on', i < 0); return; }
  if (D.color) { syncRoutineForm(); form.color = D.color; document.querySelectorAll('[data-color]').forEach(b => b.classList.toggle('on', b.dataset.color === D.color)); return; }
  if ('addstep' in D) { syncRoutineForm(); form.steps.push({ id: uid(), text: '', mins: 0 }); drawRoutineForm(true); const l = document.querySelectorAll('[data-st]'); l[l.length - 1].focus(); return; }
  if (D.rmstep != null) { syncRoutineForm(); form.steps.splice(+D.rmstep, 1); drawRoutineForm(true); return; }
  if ('saver' in D) {
    syncRoutineForm();
    if (!form.name.trim()) { $('#f-name').focus(); return; }
    const o = { id: form.id, name: form.name.trim(), emoji: form.emoji.trim(), color: form.color, time: form.time, days: form.days, steps: form.steps.filter(s => s.text.trim()) };
    const i = data.routines.findIndex(x => x.id === o.id); i < 0 ? data.routines.push(o) : data.routines[i] = o;
    save(); closeSheet(); render(); resync(); return;
  }
  if ('delr' in D) { delRoutine(form.id); return; }
  if ('savem' in D) {
    const title = $('#m-title').value.trim(), at = $('#m-at').value;
    if (!title) { $('#m-title').focus(); return; } if (!at) { $('#m-at').focus(); return; }
    const i = data.reminders.findIndex(x => x.id === form.id), o = { id: form.id, title, at, done: false };
    i < 0 ? data.reminders.push(o) : data.reminders[i] = o; save(); closeSheet(); render(); resync(); return;
  }
  if ('delm' in D) { delReminder(form.id); return; }
  if (t.id === 'perm') { askPerm(); return; }
  if (t.id === 'testn') { notify({ key: 'test-' + Date.now(), title: 'Routines', body: 'Notifications are working.' }); return; }
  if (t.id === 'exp') {
    const b = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'routines-' + dstr(new Date()) + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); return;
  }
  if (t.id === 'imp') { $('#file').click(); return; }
  if (t.id === 'reset') { confirmDlg('Reset everything?', 'All routines, reminders and ticks will be replaced with the three examples.', 'Reset', true).then(ok => { if (ok) { data = seed(); save(); render(true); resync(); } }); return; }
});
document.addEventListener('change', async ev => {
  if (ev.target.id !== 'file') return;
  const f = ev.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!j || !Array.isArray(j.routines) || !Array.isArray(j.reminders || [])) throw new Error('bad');
    ev.target.value = '';
    if (!await confirmDlg('Replace data?', 'Your current routines and reminders will be replaced with the imported file.', 'Import', true)) return;
    j.reminders = j.reminders || []; j.ticks = j.ticks || { date: '', map: {} };
    data = j; rollDay(); save(); render(); resync(); alertDlg('Imported', j.routines.length + ' routines loaded.');
  } catch (e) { alertDlg('Import failed', 'That file is not valid Routines data.'); }
  ev.target.value = '';
});
/* no long-press menus / selection outside fields */
document.addEventListener('contextmenu', e => { if (!e.target.closest('input,textarea')) e.preventDefault(); });
document.addEventListener('selectstart', e => { if (!e.target.closest || !e.target.closest('input,textarea')) e.preventDefault(); });
/* escape + hardware back: dialog -> sheet -> Today -> exit */
function backStep() {
  if (dlgRes) { closeDialog(false); return true; }
  if (sheetOpen()) { closeSheet(); return true; }
  if (tab !== 'today') { go('today'); return true; }
  return false;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (dlgRes || sheetOpen())) { e.preventDefault(); backStep(); } });
if (isNative) {
  const P = window.Capacitor.Plugins;
  // A registered backButton listener stops the native default (exit); the actual handling runs on the
  // document 'backbutton' event, which Capacitor fires reliably even when the early plugin callback is dropped.
  let lastBack = 0;
  const onBack = () => { const n = Date.now(); if (n - lastBack < 250) return; lastBack = n; if (!backStep()) { try { P.App.exitApp(); } catch (e) {} } };
  try { P.App && P.App.addListener('backButton', onBack); } catch (e) {}
  document.addEventListener('backbutton', onBack);
  try { if (P.StatusBar) { P.StatusBar.setStyle({ style: 'DARK' }); P.StatusBar.setBackgroundColor({ color: '#000000' }); } } catch (e) {}
}

/* ---------- OTA web-bundle updates (self-hosted, @capgo/capacitor-updater manual mode) ---------- */
function vcmp(a, b) {   // compare dotted versions numerically; non-numeric (e.g. 'builtin') sorts lowest
  const p = v => String(v || '').split('.').map(n => parseInt(n, 10));
  const x = p(a), y = p(b);
  for (let i = 0; i < Math.max(x.length, y.length); i++) {
    const m = x[i] || 0, n = y[i] || 0;
    if (isNaN(m) || isNaN(n)) return isNaN(m) ? (isNaN(n) ? 0 : -1) : 1;
    if (m !== n) return m > n ? 1 : -1;
  }
  return 0;
}
async function otaCheck() {
  const U = window.Capacitor.Plugins.CapacitorUpdater;
  if (!U) return;
  try { await U.notifyAppReady(); } catch (e) {}   // must run every launch or the bundle is rolled back
  try {
    const cur = await U.current();
    const b = cur && cur.bundle;
    // A bundle queued by next() is normally applied when the app is backgrounded; if the app was killed
    // in the foreground instead, apply it now on cold launch.
    // Only ever move forward: APP_VERSION is the version of the bundle that is running right now.
    try { const nx = await U.getNextBundle(); if (nx && nx.id && b && nx.id !== b.id && nx.status !== 'error' && vcmp(nx.version, APP_VERSION) > 0) { await U.set({ id: nx.id }); return; } } catch (e) {}
    const r = await fetch(OTA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (!j || !j.version || !j.url || vcmp(j.version, APP_VERSION) <= 0) return;
    let nb = null;
    try { const l = await U.list(); nb = (l.bundles || []).find(x => x.version === j.version && x.status !== 'error') || null; } catch (e) {}
    if (!nb) nb = await U.download({ url: j.url, version: j.version, checksum: j.checksum || '' });
    if (!nb || !nb.id) return;
    await U.next({ id: nb.id });
    otaToast(U, nb.id);
  } catch (e) { /* silent */ }
}
function otaToast(U, id) {
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = '<span>Update ready — restart to apply</span><button class="btn pri">Restart now</button>';
  t.querySelector('button').addEventListener('click', () => { U.set({ id }).catch(() => {}); });
  document.body.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('on')));
  setTimeout(() => t.classList.remove('on'), 12000);
}

/* ---------- boot ---------- */
buildNav(); load(); render(true);
setInterval(() => { if (!document.hidden) { tickCD(); if (!sheetOpen() && new Date().getSeconds() === 0) render(); } }, 1000);
setInterval(checkDue, 15000);                                   // fallback while app is open
document.addEventListener('visibilitychange', () => { if (!document.hidden) { rollDay(); if (!sheetOpen()) render(); checkDue(); } });
window.addEventListener('focus', checkDue);
if (isNative) nativeInit();
if (isNative) otaCheck();
else if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { scope: './' }).then(() => navigator.serviceWorker.ready).then(r => { swReg = r; resync(); }).catch(e => console.warn('SW failed', e));
} else checkDue();
</script>
