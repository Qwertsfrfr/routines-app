<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Routines</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
<script>if(window.RoutinesNative)document.documentElement.className='booting';try{var p=localStorage.getItem('routines-theme-v1')||'system',n=null;try{n=window.RoutinesNative?JSON.parse(RoutinesNative.geom()).night:null}catch(e){}var l=p==='light'||(p==='system'&&(n!=null?!n:matchMedia('(prefers-color-scheme: light)').matches));document.documentElement.dataset.theme=l?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<style>
@font-face{font-family:Geist;src:url(fonts/geist.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Geist Mono';src:url(fonts/geist-mono.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Instrument Serif';src:url(fonts/instrument-serif.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Instrument Serif';src:url(fonts/instrument-serif-italic.woff2) format('woff2');font-weight:400;font-style:italic;font-display:swap}
:root{--bg:#000;--fg:#fff;--W:255,255,255;--G18:18,18,18;--G22:22,22,22;--ka:1;--s05:#050505;--s07:#070707;--s0b:#0b0b0b;--sec:#ececec;--cs:dark;--t1:rgba(var(--W),.94);--t2:rgba(var(--W),.6);--t3:rgba(var(--W),.4);--t4:rgba(var(--W),.22);
--line:rgba(var(--W),.08);--line2:rgba(var(--W),.14);--line3:rgba(var(--W),.26);--fill:rgba(var(--W),.035);--sheet:#0a0a0a;--ink:#000;
--body:Geist,Roboto,system-ui,-apple-system,sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,monospace;--disp:'Instrument Serif',Georgia,serif;
--e:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.5,.5,1);--roll:cubic-bezier(.7,0,.2,1);--sheetE:cubic-bezier(.32,.72,0,1);--d1:150ms;--d2:220ms;--d3:300ms}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,*{scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html.intro-on,html.intro-on body{overflow:hidden!important;height:100%}
html{background:var(--bg);color-scheme:var(--cs)}
body{margin:0;background:var(--bg);color:var(--t1);font:15px/1.5 var(--body);letter-spacing:-.005em;padding-top:env(safe-area-inset-top);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-variant-numeric:tabular-nums}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.mono,.lab,.sh,.stat,.tag,.rt,.tm,.mt{font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:.01em}
.mut{color:var(--t2)}.acc{color:var(--fg)}.dim{color:var(--t3)}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}
.ic{stroke-width:1.5}

/* backdrop: drifting dot grid, radial fade */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;-webkit-mask-image:radial-gradient(130% 55% at 50% 0%,#000 10%,transparent 78%);mask-image:radial-gradient(130% 55% at 50% 0%,#000 10%,transparent 78%)}
.bgfx i{position:absolute;inset:-24px;background-image:radial-gradient(rgba(var(--W),.17) 1px,transparent 1.3px);background-size:24px 24px;animation:drift 20s linear infinite;will-change:transform}
.bgfx::after{content:"";position:absolute;left:50%;top:-34vh;width:130vw;height:64vh;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(var(--W),.08),transparent)}
@keyframes drift{to{transform:translate3d(24px,24px,0)}}

main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:12px 20px calc(124px + env(safe-area-inset-bottom));view-transition-name:main;transition:transform 480ms var(--sheetE),opacity 480ms var(--sheetE)}
body.sheeted main{transform:scale(calc(.93 + .07 * var(--dp,0)));opacity:calc(.45 + .55 * var(--dp,0))}
body.dragging main{transition:none}

/* entrances: staggered blur-fade */
@keyframes rise{from{opacity:0;transform:translateY(10px);filter:blur(6px)}}
.stg .r{animation:rise 560ms var(--e) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes blurin{from{opacity:0;filter:blur(10px);transform:translateY(.22em)}}
.bl>span{display:inline-block;white-space:pre}
.stg .bl>span{animation:blurin 760ms var(--e) both;animation-delay:calc(var(--j,0) * 38ms + 80ms)}

/* rolling digits */
.roll{display:inline-flex}
.dg{display:inline-block;height:1em;line-height:1;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
.dgs{display:flex;flex-direction:column;transform:translateY(calc(var(--v,0) * -10%));transition:transform 720ms var(--roll);will-change:transform}
.sec .dgs,.cd .dgs{transition-duration:480ms}
.dgs>b{display:block;height:1em;font-weight:inherit;text-align:center}
.dc{display:inline-block;line-height:1}

/* today */
.top{display:flex;justify-content:space-between;align-items:center;padding-top:10px;color:var(--t3)}
.top .mono{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.top .mono:first-child{color:var(--t1)}
.clock{display:flex;align-items:flex-end;gap:12px;margin:22px 0 26px;line-height:1}
.clock .hm{font-family:var(--disp);font-size:min(34vw,156px);letter-spacing:-.01em;color:var(--fg)}
.clock .hm .dc{color:var(--t3);margin:0 .02em;transform:translateY(-.04em)}
.clock .sec{font-family:var(--mono);font-size:14px;color:var(--t3);padding-bottom:.95em}
.hero{position:relative;isolation:isolate;overflow:hidden;padding:22px;border-radius:24px;background:var(--line2)}
.hero::before{content:"";position:absolute;z-index:-2;left:50%;top:50%;width:170%;aspect-ratio:1;background:conic-gradient(transparent 0deg 240deg,rgba(var(--W),.1) 290deg,rgba(var(--W),.75) 345deg,var(--fg) 356deg,transparent 360deg);transform:translate(-50%,-50%);animation:beam 6.5s linear infinite;will-change:transform}
.hero::after{content:"";position:absolute;z-index:-1;inset:1px;border-radius:23px;background:radial-gradient(130% 85% at 0% 0%,rgba(var(--W),.075),transparent 58%),var(--s05)}
.hero.idle::before{animation-duration:11s;opacity:.5}
@keyframes beam{to{transform:translate(-50%,-50%) rotate(1turn)}}
.lab{display:flex;align-items:center;gap:10px;color:var(--t2);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.pulse{position:relative;width:6px;height:6px;border-radius:50%;background:var(--fg);flex:none}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--fg);animation:ping 2.2s var(--e) infinite}
@keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(3.4);opacity:0}}
.pulse.idle{background:var(--t3)}.pulse.idle::after{display:none}
.hrow{display:flex;align-items:center;gap:16px}
.title{font-family:var(--disp);font-style:italic;font-size:40px;font-weight:400;line-height:1;letter-spacing:-.01em;margin:16px 0 8px;color:var(--fg);overflow-wrap:anywhere}
.title.dim{color:var(--t3)}
.title>span{display:inline-block}
.cdw{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.cd{display:flex;font-size:46px;font-weight:300;line-height:1;letter-spacing:-.035em;color:var(--fg)}
.cdl{margin-top:10px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.cta{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:22px;height:52px;padding:0 18px 0 20px;border:0;border-radius:15px;background:var(--sec);color:var(--ink);font:500 15px var(--body);letter-spacing:-.01em;transition:transform var(--d1) var(--e)}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,var(--fg) 50%,transparent 70%);transform:translateX(-110%);animation:shine 4.2s var(--e) infinite 1.2s}
.cta>*{position:relative;z-index:1}
.cta .ic{transition:transform var(--d2) var(--e)}.cta:active .ic{transform:translateX(4px)}
@keyframes shine{0%{transform:translateX(-110%)}55%,100%{transform:translateX(110%)}}
.nx{display:flex;align-items:center;gap:12px;padding:16px 6px 0;color:var(--t3)}
.nx>.mono:first-child{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.nxn{font-size:15px;font-weight:500;color:var(--t1)}
.sh{display:flex;align-items:center;gap:12px;margin:46px 0 4px;color:var(--t3);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase}
.sh i{flex:1;height:1px;background:linear-gradient(90deg,var(--line3),transparent)}
.sh span:last-child{color:var(--t2)}

/* ring */
.ringw{position:relative;flex:none;display:grid;place-items:center}
.ringw svg{transform:rotate(-90deg);display:block}
.ring .trk{stroke:rgba(var(--W),.12)}
.ring .bar{stroke:var(--fg);stroke-linecap:round;transition:stroke-dashoffset 600ms var(--e)}
.stg .ring .bar,.fresh .ring .bar{animation:ringin 900ms var(--e) both 200ms}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}
.ringw .rt{position:absolute;font-size:11px;color:var(--t1)}
.ringw.win{animation:win 520ms var(--spring)}
@keyframes win{40%{transform:scale(1.08)}}

/* spotlight press-glow */
.fx{position:relative;overflow:hidden}
.spot{position:absolute;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--W),.13),rgba(var(--W),.04) 55%,transparent);pointer-events:none;animation:spot 760ms var(--e) forwards}
@keyframes spot{from{transform:scale(.15);opacity:1}to{transform:scale(1);opacity:0}}

/* rows */
.tr,.rr,.rmb,.trb{display:flex;align-items:center;gap:16px;width:100%;background:none;border:0;color:inherit;text-align:left;padding:0}
.tr,.rr{padding:18px 0;border-bottom:1px solid var(--line);transition:transform var(--d1) var(--e),opacity var(--d2)}
.tr{padding:0;gap:8px}.trb{flex:1;min-width:0;padding:18px 0;transition:transform var(--d1) var(--e)}
.trb:active,.rr:active,.step:active,.rmb:active{transform:scale(.985)}
.tr .tm,.tr .mt{transition:opacity 400ms var(--e),color 400ms var(--e)}
.nmt{background:linear-gradient(rgba(var(--W),.9),rgba(var(--W),.9)) no-repeat 0 58%/0% 1.5px;transition:background-size 640ms var(--roll),color 420ms var(--e)}
.tr.fin .nmt{background-size:100% 1.5px;color:var(--t3)}
.tr.fin .tm,.tr.fin .mt{opacity:.5}
.tdone{position:relative;width:44px;height:44px;flex:none;display:grid;place-items:center;margin-right:-8px;padding:0;border:0;background:none;color:var(--ink);transition:transform var(--d1) var(--e)}
.tdone>*{grid-area:1/1}
.tdone .ring .bar{stroke:var(--fg)}
.tdone .tfill{width:26px;height:26px;border-radius:50%;background:var(--fg);transform:scale(.4);opacity:0;transition:transform 420ms var(--spring),opacity 200ms var(--e)}
.tdone>svg:not(.ring){position:relative;width:14px;height:14px}
.tdone>svg path{fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset var(--d2) var(--e)}
.tdone::after{content:"";position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--fg);opacity:0;pointer-events:none}
.tdone.on .tfill{transform:scale(1);opacity:1}
.tdone.on .ringw{opacity:0;transition:opacity var(--d2)}
.tdone.on>svg path{stroke-dashoffset:0;transition-delay:120ms;transition-duration:340ms}
.tdone.on.pop::after{animation:burst 640ms var(--e)}
@keyframes burst{from{transform:scale(.9);opacity:.9}to{transform:scale(2.1);opacity:0}}
.tdone:active{transform:scale(.92)}
.gone{pointer-events:none}
.tr .tm{width:46px;flex:none;color:var(--t3)}
.nm{display:block;font-size:16.5px;font-weight:500;line-height:1.3;letter-spacing:-.015em;color:var(--t1)}
.mt{display:block;margin-top:4px;color:var(--t3);font-size:11.5px}
.tr.now .tm{color:var(--fg)}
.tr.past{opacity:.42}
.tag{display:inline-block;margin-left:10px;padding:2px 7px 1px;border-radius:999px;background:var(--fg);color:var(--ink);font-size:9.5px;font-style:normal;font-weight:500;letter-spacing:.14em;text-transform:uppercase;vertical-align:2px}
.sq{display:none}
.idx{display:block;width:22px;flex:none;align-self:flex-start;padding-top:4px;color:var(--t4);font-size:11px}
.rtime{font-family:var(--disp);font-size:28px;line-height:1;color:var(--fg);align-self:flex-start}
.days{display:flex;gap:4px;margin-top:10px}
.days i{width:20px;height:20px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line);font:500 10px var(--mono);font-style:normal;color:var(--t4)}
.days i.on{background:var(--fg);border-color:var(--fg);color:var(--ink)}
.rm{display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);transition:opacity var(--d3) var(--e)}
.rm.on .nm{color:var(--t3)}
.ph{display:flex;align-items:flex-start;gap:10px;margin:30px 0 18px}
.ph h1{margin:0;font-family:var(--disp);font-style:italic;font-size:58px;font-weight:400;line-height:.95;letter-spacing:-.02em;color:var(--fg)}
.ph sup{margin-top:6px;padding:2px 9px;border:1px solid var(--line2);border-radius:999px;font:400 11px/1.5 var(--mono);color:var(--t2)}
.empty{padding:40px 0 16px}
.empty .eic{width:48px;height:48px;display:grid;place-items:center;margin-bottom:18px;border:1px solid var(--line2);border-radius:14px;background:var(--fill);color:var(--t2)}
.empty b{display:block;font-family:var(--disp);font-size:30px;font-weight:400;line-height:1.05;color:var(--fg)}
.empty>span:not(.eic){display:block;margin-top:6px}
.empty .btn{margin-top:22px}
.empty.sm{padding:24px 0 8px}.empty.sm b{font-size:22px;color:var(--t2)}

/* checkbox */
.box{position:relative;width:22px;height:22px;flex:none;display:grid;place-items:center;padding:0;border-radius:7px;border:1.5px solid var(--line3);background:none;color:var(--ink);transition:transform var(--d1) var(--e),border-color var(--d2)}
.box::before{content:"";position:absolute;inset:-1.5px;border-radius:7px;background:var(--fg);opacity:0;transform:scale(.5);transition:opacity var(--d2) var(--e),transform 420ms var(--spring)}
.box svg{position:relative;width:14px;height:14px}
.box path{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset 340ms var(--e) 90ms}
.on>.box,.box.on{border-color:var(--fg)}
.on>.box::before,.box.on::before{opacity:1;transform:none}
.on>.box path,.box.on path{stroke-dashoffset:0}
.box:active{transform:scale(.92)}
button.box::after{content:"";position:absolute;inset:-10px}
.pop>.box,.box.pop,.tdone.pop{animation:pop 460ms var(--spring)}
@keyframes pop{0%{transform:scale(.86)}100%{transform:scale(1)}}
.step{display:flex;gap:16px;align-items:center;width:100%;min-height:58px;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--t1);text-align:left;font:400 15.5px/1.4 var(--body);letter-spacing:-.01em;transition:transform var(--d1) var(--e)}
.step>.mono{color:var(--t3)}
.tx{transition:color 420ms var(--e)}.step.on .tx{color:var(--t3)}
.tx>span{position:relative}
.tx>span::after{content:"";position:absolute;left:0;right:0;top:56%;height:1.5px;background:rgba(var(--W),.85);transform:scaleX(0);transform-origin:left;transition:transform 560ms var(--roll)}
.step.on .tx>span::after{transform:scaleX(1)}
.fresh .step{animation:rise 520ms var(--e) both;animation-delay:calc(var(--i,0) * 40ms + 120ms)}

/* nav: floating frosted capsule, inverting pill */
nav{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:24px;background:rgba(var(--G18),.74);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);border:1px solid rgba(var(--W),.1);box-shadow:0 12px 40px rgba(0,0,0,calc(.7 * var(--ka))),inset 0 1px 0 rgba(var(--W),.06);view-transition-name:nav}
nav button{position:relative;height:54px;border:0;background:none;color:var(--t3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 10.5px var(--body);letter-spacing:.01em;transition:color var(--d3) var(--e)}
nav button .ic{width:20px;height:20px;transition:transform var(--d1) var(--e)}
nav button:active .ic{transform:scale(.9)}
nav button.on{color:var(--fg)}
nav .ind{position:absolute;z-index:2;left:6px;top:6px;bottom:6px;width:calc((100% - 12px) / 4);border-radius:18px;background:var(--fg);mix-blend-mode:difference;pointer-events:none;transform:translateX(calc(var(--k,0) * 100%));transition:transform 520ms cubic-bezier(.65,0,.2,1)}
.fab{position:fixed;right:20px;bottom:calc(96px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:18px;border:0;background:var(--fg);color:var(--ink);display:grid;place-items:center;z-index:4;box-shadow:0 10px 30px rgba(0,0,0,calc(.65 * var(--ka)));transform:translateY(10px) scale(.9);opacity:0;pointer-events:none;transition:transform 380ms var(--spring),opacity var(--d2) var(--e)}
.fab .ic{width:22px;height:22px;stroke-width:1.75}
.fab.show{transform:none;opacity:1;pointer-events:auto}
.fab.show:active{transform:scale(.94)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,calc(.55 * var(--ka)));z-index:10;opacity:0;pointer-events:none;transition:opacity 420ms var(--sheetE)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:90vh;overflow:auto;overscroll-behavior:contain;background:var(--sheet);border:1px solid var(--line2);border-bottom:0;border-radius:28px 28px 0 0;padding:0 22px calc(24px + env(safe-area-inset-bottom));z-index:11;transform:translateY(105%);transition:transform 320ms var(--sheetE);box-shadow:0 -24px 60px rgba(0,0,0,calc(.8 * var(--ka))),0 90px 0 var(--sheet)}
.sheet.open{transform:translateY(0);transition:transform 520ms var(--sheetE)}
.sheet.drag{transition:none}
.grab{height:26px;display:grid;place-items:center;position:sticky;top:0;margin:0 -22px;background:var(--sheet);z-index:2}
.grab i{width:36px;height:4px;border-radius:4px;background:rgba(var(--W),.22)}
.swap{animation:rise 380ms var(--e) both}
.ck-head{display:flex;align-items:center;gap:16px;padding:8px 0 18px;border-bottom:1px solid var(--line)}
.ck-head .mono,.sc>.mono:first-child{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.ck-title,.sh-title{font-family:var(--disp);font-size:36px;font-weight:400;line-height:1.02;letter-spacing:-.01em;margin-top:8px;color:var(--fg);overflow-wrap:anywhere}
.ck-title{font-style:italic}
.sh-title{margin-bottom:6px}
.acts{display:flex;gap:8px;margin-top:24px}
label{display:block;margin:22px 0 8px;color:var(--t3);font:400 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase}
input[type=text],input[type=time],input[type=number],input[type=datetime-local]{width:100%;height:48px;padding:0 14px;border-radius:13px;border:1px solid var(--line2);background:var(--fill);color:var(--fg);font:400 15px var(--body);color-scheme:var(--cs);transition:border-color var(--d2) var(--e),box-shadow var(--d2) var(--e)}
input:focus{outline:none;border-color:rgba(var(--W),.5);box-shadow:0 0 0 4px rgba(var(--W),.07)}
input::placeholder{color:var(--t4)}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.chip{height:42px;border-radius:12px;border:1px solid var(--line2);background:var(--fill);color:var(--t2);font:500 12px var(--mono);transition:transform var(--d1) var(--e),color var(--d2) var(--e),background-color var(--d2) var(--e),border-color var(--d2) var(--e)}
.chip.on{color:var(--ink);background:var(--fg);border-color:var(--fg)}
.sws{display:flex;gap:12px;flex-wrap:wrap}
.sw{position:relative;width:28px;height:28px;border-radius:50%;border:0;padding:0}
.srow{gap:8px;margin-bottom:8px}.srow input[type=text]{flex:1;min-width:0}.srow input[type=number]{flex:none}.sn{width:20px;flex:none;color:var(--t4)}
.btn{height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line2);background:var(--fill);font:500 14.5px var(--body);letter-spacing:-.005em;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform var(--d1) var(--e),background-color var(--d2) var(--e)}

.btn:active,.chip:active,.sw:active,.cta:active,.x:active{transform:scale(.97)}
.x{width:40px;height:48px;flex:none;border:0;background:none;color:var(--t3);display:grid;place-items:center;transition:transform var(--d1) var(--e)}
.set{border-top:1px solid var(--line);padding:22px 0}

.stat{padding:3px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--t2);font-size:11px}
.stat.ok{background:var(--fg);border-color:var(--fg);color:var(--ink)}
.note{font-size:14px;line-height:1.55;color:var(--t2);margin:0 0 18px}

/* dialog */
.dscrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,calc(.7 * var(--ka)));opacity:0;pointer-events:none;transition:opacity var(--d2) var(--e)}

.dlg{position:fixed;left:16px;right:16px;top:50%;z-index:21;max-width:400px;margin:0 auto;padding:24px;background:var(--s0b);border:1px solid var(--line2);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,calc(.9 * var(--ka))),inset 0 1px 0 rgba(var(--W),.06);opacity:0;pointer-events:none;transform:translateY(-50%) scale(.95);filter:blur(4px);transition:transform var(--d1) var(--e),opacity var(--d1) var(--e),filter var(--d1) var(--e)}
.dlg.open{opacity:1;pointer-events:auto;transform:translateY(-50%);filter:none;transition:transform 360ms var(--spring),opacity var(--d2) var(--e),filter var(--d3) var(--e)}
.dlg .dk{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--t3);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase}
.dlg .dk i{width:5px;height:5px;border-radius:50%;background:var(--fg)}
.dlg .dt{font-family:var(--disp);font-size:30px;font-weight:400;line-height:1.05;margin:0 0 10px;color:var(--fg);overflow-wrap:anywhere}
.dlg .note{margin:0}
.dlg .acts{margin-top:22px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:25;max-width:420px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 18px;background:rgba(var(--G22),.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line2);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,calc(.7 * var(--ka)));font:400 14px var(--body);color:var(--fg);opacity:0;transform:translateY(10px) scale(.98);transition:opacity var(--d3) var(--e),transform 420ms var(--spring);pointer-events:none}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast span{flex:1}.toast .btn{height:38px;padding:0 14px;border-radius:12px;font-size:13px}

/* live ticker bump */
.tk{display:inline-block}
.tk.bump{animation:tick 520ms var(--e)}
@keyframes tick{from{opacity:0;transform:translateY(.45em);filter:blur(4px)}}

/* photos: thumbnails, form slots */
.th{position:relative;flex:none;display:block;width:36px;height:36px;padding:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--fill);transition:transform var(--d1) var(--e)}
.th img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity var(--d3) var(--e)}
.th img.ld{opacity:1}
.th:active{transform:scale(.94)}
.th.lg{width:52px;height:52px;border-radius:14px}
.tr .th{width:40px;height:40px;border-radius:11px}
.rr .th{width:40px;height:40px;border-radius:11px;align-self:center}
.step .th{margin-left:-4px}
.pslot{display:flex;align-items:center;gap:8px}
.pslot .th.pv{width:72px;height:72px;border-radius:16px;margin-right:4px}
.pslot>.btn:last-child:not(.full){width:48px;padding:0;flex:none}
.pmini{position:relative;width:44px;height:48px;flex:none}
.pmb{width:44px;height:48px;padding:0;border:0;background:none;color:var(--t3);display:grid;place-items:center;transition:transform var(--d1) var(--e)}
.pmb:active{transform:scale(.92)}
.pmb .th{width:38px;height:38px;pointer-events:none}
.rmx{position:absolute;top:0;right:-2px;width:20px;height:20px;padding:0;border-radius:50%;border:2px solid var(--sheet);background:var(--fg);color:var(--ink);display:grid;place-items:center}
.rmx .ic{stroke-width:2.5}
.rmx::after{content:"";position:absolute;inset:-8px}
.busy{animation:busy 900ms var(--e) infinite alternate}
@keyframes busy{to{opacity:.35}}
.pin{animation:rise 380ms var(--e) both}

/* fullscreen viewer: blur backdrop, FLIP zoom, pinch/pan */
.viewer{position:fixed;inset:0;z-index:18;display:none;touch-action:none;overflow:hidden}
.viewer.open{display:block}
.vbg{position:absolute;inset:0;background:rgba(0,0,0,calc(.74 * var(--ka)));-webkit-backdrop-filter:blur(26px) saturate(120%);backdrop-filter:blur(26px) saturate(120%);opacity:0;transition:opacity 380ms var(--sheetE)}
.viewer.on .vbg{opacity:1}
.vz{position:absolute;inset:0;transform-origin:0 0}
.vz.ease{transition:transform 380ms var(--sheetE)}
.vz img{position:absolute;display:block;border-radius:6px;transform-origin:50% 50%;will-change:transform;box-shadow:0 30px 90px rgba(0,0,0,calc(.7 * var(--ka)))}
.vx{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:rgba(var(--G18),.6);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:var(--fg);display:grid;place-items:center;opacity:0;transition:opacity var(--d3) var(--e),transform var(--d1) var(--e)}
.vx:active{transform:scale(.92)}
.vcap{position:absolute;left:20px;right:20px;text-shadow:0 1px 14px rgba(0,0,0,calc(.95 * var(--ka))),0 0 4px rgba(0,0,0,calc(.8 * var(--ka)));bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;color:var(--t1);font:400 12px var(--mono);letter-spacing:.04em;opacity:0;transform:translateY(6px);transition:opacity var(--d3) var(--e),transform var(--d3) var(--e)}
.viewer.on .vx,.viewer.on .vcap{opacity:1;transform:none}

/* AI import */
.ais{display:flex;align-items:center;gap:10px;margin:30px 0 12px;color:var(--t1);font:400 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase}
.ais .ain{padding:2px 8px 1px;border-radius:999px;border:1px solid var(--line2);color:var(--t2);letter-spacing:.04em}
.code{margin:0 0 10px;max-height:230px;overflow:auto;overscroll-behavior:contain;padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--s05);color:var(--t2);font:400 11px/1.65 var(--mono);white-space:pre;tab-size:2}
textarea{display:block;width:100%;min-height:190px;padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--fill);color:var(--fg);font:400 12px/1.6 var(--mono);color-scheme:var(--cs);resize:vertical;transition:border-color var(--d2) var(--e),box-shadow var(--d2) var(--e)}
textarea:focus{outline:none;border-color:rgba(var(--W),.5);box-shadow:0 0 0 4px rgba(var(--W),.07)}
textarea::placeholder{color:var(--t4)}
textarea.bad{border-color:rgba(var(--W),.55)}
.aierr{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--line3);background:rgba(var(--W),.045);font-size:13.5px;line-height:1.5;color:var(--t2)}
.aierr .ic{flex:none;margin-top:1px;color:var(--fg)}
.aierr b{display:block;color:var(--fg);font-weight:500}
.aipv{margin-top:22px}
.aisum{font-family:var(--disp);font-size:32px;line-height:1.05;color:var(--fg)}
.aisub{margin-top:6px}
.pi{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);animation:rise 420ms var(--e) both;animation-delay:calc(var(--i,0) * 40ms)}
.pi .pik{width:46px;flex:none;align-self:flex-start;padding-top:2px;color:var(--t2)}
.pi.dup{opacity:.4}
.pi .days{margin-top:8px}
.tag.gh{background:none;border:1px solid var(--line3);color:var(--t2)}
.aiw{margin-top:16px;padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--fill)}
.aiw>.mono{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--t2)}
.aiw ul{margin:8px 0 0;padding:0;list-style:none}
.aiw li{position:relative;padding:3px 0 3px 16px;font-size:13px;line-height:1.45;color:var(--t2)}
.aiw li::before{content:"";position:absolute;left:2px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--t3)}
.ph .btn.sm{margin-left:auto;align-self:center;height:38px;padding:0 14px;border-radius:12px;font-size:13px}
.okfx{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 0 28px}
.okc{position:relative;width:88px;height:88px;display:grid;place-items:center;color:var(--ink)}
.okc>i{position:absolute;inset:0;border-radius:50%;background:var(--fg);animation:okin 640ms var(--spring) both}
.okc::before,.okc::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--fg);opacity:0;animation:burst 1000ms var(--e) 200ms}
.okc::after{animation-delay:380ms}
.okc svg{position:relative;width:38px;height:38px}
.okc path{fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;animation:draw 480ms var(--e) forwards 340ms}
@keyframes okin{from{transform:scale(.3);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.ok-t{font-family:var(--disp);font-style:italic;font-size:46px;line-height:1;color:var(--fg);margin:28px 0 10px}
.ckrow{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:6px 0;border:0;background:none;color:var(--t2);text-align:left;font:400 14px var(--body)}
.ckrow .box{width:20px;height:20px;border-radius:6px}.ckrow .box::before{border-radius:6px}
.ckrow.on{color:var(--t1)}

/* view transitions: soft crossfade + small translate */
::view-transition-old(root){display:none}
::view-transition-new(root){animation:none}
::view-transition-old(nav){display:none}
::view-transition-new(nav){animation:none}
::view-transition-group(main){animation-duration:var(--d3);animation-timing-function:var(--e)}
::view-transition-old(main){animation:vtOut var(--d1) var(--e) both}
::view-transition-new(main){animation:vtIn var(--d3) var(--e) both}
html[data-dir=back]::view-transition-old(main){animation-name:vtOutB}
html[data-dir=back]::view-transition-new(main){animation-name:vtInB}
@keyframes vtOut{to{opacity:0;transform:translateX(-8px)}}
@keyframes vtIn{from{opacity:0;transform:translateX(8px)}}
@keyframes vtOutB{to{opacity:0;transform:translateX(8px)}}
@keyframes vtInB{from{opacity:0;transform:translateX(-8px)}}

/* chunky rounded cards, calmer rhythm */
.hero{border-radius:28px;padding:24px}.hero::after{border-radius:27px}
.sh{margin-top:52px}
.rr,.rm{padding:18px;margin-bottom:10px;border:1px solid var(--line);border-radius:22px;background:var(--fill);transition:transform var(--d2) var(--e),background-color var(--d2) var(--e),opacity var(--d3) var(--e)}
.rr:active{background:rgba(var(--W),.06)}
.rm.on{opacity:.55}

/* visual countdown ring on the Now card */
.vt{position:relative;display:grid;place-items:center;width:min(62vw,236px);aspect-ratio:1;margin:26px auto 2px}
.vt>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.vt .tks{stroke:rgba(var(--W),.16)}
.vt .trk{stroke:rgba(var(--W),.07)}
.vt .drn{stroke:var(--fg);stroke-linecap:round;transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 7px rgba(var(--W),.35))}
.stg .vt .drn,.vt.fresh .drn{animation:drin 1200ms var(--e) both 220ms}
@keyframes drin{from{stroke-dashoffset:var(--c)}}
.vt .in{position:relative;display:flex;flex-direction:column;align-items:center}
.vt .cd{justify-content:center;font-size:clamp(34px,11vw,46px)}
.vt .cdl{margin-top:10px;color:var(--t3)}
.vt.up .drn{animation:upp 1.6s var(--e) infinite}
@keyframes upp{50%{opacity:.35}}
.ctas{display:flex;gap:10px;margin-top:22px}.ctas .cta{margin-top:0;flex:1}
.cta2{width:52px;height:52px;flex:none;display:grid;place-items:center;border:1px solid var(--line2);border-radius:15px;background:var(--fill);color:var(--t1);transition:transform var(--d1) var(--e),background-color var(--d2)}
.cta2:active{transform:scale(.94);background:rgba(var(--W),.08)}

/* proportional time-block timeline */
.tl{position:relative;margin-top:20px}
.tl .rail{position:absolute;left:51px;top:0;bottom:0;width:1px;background:linear-gradient(var(--line2),var(--line) 92%,transparent)}
.tl .rail i{position:absolute;left:0;top:0;width:1px;height:var(--ny,0);background:linear-gradient(transparent,rgba(var(--W),.55));transition:height 1s linear}
.hl,.gl{position:absolute;left:0;width:44px;transform:translateY(-50%);font:400 10.5px/1 var(--mono);letter-spacing:.02em;color:var(--t4)}
.gl{color:var(--t2);transform:none;padding-top:15px}
.gl::after{content:"";position:absolute;left:48px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line3)}
.gl.now{color:transparent}.gl.now::after{display:none}
.gl.past{color:var(--t4)}.gl.past::after{box-shadow:inset 0 0 0 1.5px var(--t4)}
.gap{position:absolute;left:66px;right:0;display:flex;align-items:center;gap:10px;color:var(--t4);font:400 10.5px var(--mono);letter-spacing:.06em}
.gap::after{content:"";flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--line2) 0 3px,transparent 3px 7px)}
.tl .tr{position:absolute;left:66px;right:0;width:auto;align-items:flex-start;padding:0 8px 0 18px;border:1px solid var(--line2);border-bottom:1px solid var(--line2);border-radius:22px;background:linear-gradient(rgba(var(--W),.045),rgba(var(--W),.015));isolation:isolate;transition:opacity 400ms var(--e),background-color 400ms var(--e),border-color 400ms var(--e),transform var(--d2) var(--e)}
.tl .trb{align-self:stretch;align-items:flex-start;padding:15px 0}
.tl .tr .th{margin-top:12px}
.tl .tdone{margin-top:4px}
.tl .tr:has(.trb:active){transform:scale(.985)}
.tl .trb:active{transform:none}
.tl .tr.fin{background:none;border-color:var(--line)}
.tl .tr.past{opacity:.42}
.tl .tr.now{border-color:transparent;background:var(--line2);overflow:hidden}
.tl .tr.now::before{content:"";position:absolute;z-index:-2;left:50%;top:50%;width:150%;aspect-ratio:1;background:conic-gradient(transparent 0deg 250deg,rgba(var(--W),.1) 295deg,rgba(var(--W),.7) 348deg,var(--fg) 357deg,transparent 360deg);transform:translate(-50%,-50%);animation:beam 7s linear infinite}
.tl .tr.now::after{content:"";position:absolute;z-index:-1;inset:1px;border-radius:21px;background:radial-gradient(120% 120% at 0% 0%,rgba(var(--W),.08),transparent 60%),var(--s07)}
.nl{position:absolute;left:0;right:0;top:0;height:0;z-index:3;pointer-events:none;transform:translateY(var(--ny,0));transition:transform 1s linear}
.nl::before{content:"";position:absolute;left:51px;right:0;top:-.75px;height:1.5px;background:linear-gradient(90deg,var(--fg),rgba(var(--W),.5) 40%,rgba(var(--W),.08))}
.nl::after{content:"";position:absolute;left:47.5px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 4px rgba(var(--W),.14),0 0 14px rgba(var(--W),.5)}
.nl b{position:absolute;left:0;top:0;transform:translateY(-50%);padding:3px 6px 2px;border-radius:999px;background:var(--fg);color:var(--ink);font:500 10px/1.2 var(--mono);letter-spacing:.02em}
.calm{margin:22px 0 0 66px;color:var(--t3);font-family:var(--disp);font-style:italic;font-size:19px;line-height:1.3}

/* focus mode */
body.focused main{transform:scale(.94);opacity:.3}
.focus{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));background:radial-gradient(120% 55% at 50% 0%,rgba(var(--W),.07),transparent 62%),var(--ink);opacity:0;transform:scale(1.04);pointer-events:none;transition:opacity 360ms var(--e),transform 560ms var(--sheetE)}
.focus.open{opacity:1;transform:none;pointer-events:auto}
.fz-top{display:flex;align-items:center;gap:8px;max-width:560px;width:100%;margin:0 auto}
.fz-top .x{margin-left:-10px}
.fz-k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fz-bar{display:flex;gap:5px;max-width:560px;width:100%;margin:6px auto 0}
.fz-bar i{flex:1;height:3px;border-radius:3px;background:rgba(var(--W),.12);overflow:hidden;position:relative}
.fz-bar i::after{content:"";position:absolute;inset:0;background:var(--fg);transform:scaleX(0);transform-origin:left;transition:transform 520ms var(--e)}
.fz-bar i.on::after{transform:none}
.fz-bar i.cur{background:rgba(var(--W),.3)}
.fz-stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;max-width:560px;width:100%;margin:0 auto;min-height:0}
.fz-step{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;animation:fzin 520ms var(--e) both}
.fz-step.out{position:absolute;left:0;right:0;animation:fzout 300ms var(--e) forwards;pointer-events:none}
@keyframes fzin{from{opacity:0;transform:translateX(28px);filter:blur(8px)}}
@keyframes fzout{to{opacity:0;transform:translateX(-28px);filter:blur(8px)}}
.fz-n{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase}
.fz-t{margin:12px 0 0;font-family:var(--disp);font-style:italic;font-size:clamp(36px,11vw,54px);line-height:1.02;letter-spacing:-.01em;color:var(--fg);overflow-wrap:anywhere}
.fz-ph{display:block;width:min(52vw,210px);aspect-ratio:1;margin-bottom:26px;border-radius:26px;overflow:hidden;border:1px solid var(--line2);background:var(--fill)}
.fz-ph img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity var(--d3) var(--e)}.fz-ph img.ld{opacity:1}
.fz-step .vt{width:min(54vw,212px);margin-top:30px}
.fz-hint{margin-top:18px;color:var(--t3)}
.fz-acts{display:flex;gap:10px;max-width:560px;width:100%;margin:0 auto}
.fz-acts .btn{height:60px;border-radius:18px;font-size:16px}
.fz-acts .pri{flex:1}.fz-acts .fz-skip{width:110px}
.fz-win{position:relative;width:112px;height:112px;margin-bottom:28px;display:grid;place-items:center;border-radius:50%;background:var(--fg);color:var(--ink);animation:winin 700ms var(--spring) both 80ms}
.fz-win::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--fg);animation:burst 900ms var(--e) both 260ms}
.fz-win svg{width:46px;height:46px}
.fz-win path{fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;animation:draw 420ms var(--e) forwards 420ms}
@keyframes winin{from{transform:scale(.3);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.fz-end .mono{margin-top:14px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001ms!important;transition-delay:0s!important}
  .bgfx i,.hero::before,.cta::after,.pulse::after,.tl .tr.now::before,.vt.up .drn{animation:none!important}
  .fz-win path{stroke-dashoffset:0}
}

/* light theme: the inverse of the monochrome dark look (white ground, black ink, grey hairlines) */
html[data-theme=light]{--bg:#fff;--fg:#000;--ink:#fff;--sheet:#fbfbfb;--W:0,0,0;--G18:250,250,250;--G22:255,255,255;--ka:.22;--s05:#f7f7f7;--s07:#f5f5f5;--s0b:#fafafa;--sec:#262626;--cs:light}
html[data-theme=light] .sq,html[data-theme=light] [data-color="#ffffff"]{box-shadow:inset 0 0 0 1px var(--line3)}
html[data-theme=light] .bgfx i{opacity:.55}

/* launch: plain black system splash (no icon) -> this overlay, logo centred in the visible viewport -> Today */
html.booting,html.booting body{background:#000}
#boot{position:fixed;inset:0;z-index:99;display:grid;place-items:center;margin:0;padding:0;background:#000;color:#fff;transition:background-color 560ms cubic-bezier(.2,.8,.2,1);touch-action:none}
#boot.soft{background:var(--bg);color:var(--fg);opacity:0;transition:background-color 560ms cubic-bezier(.2,.8,.2,1),opacity 200ms linear}
#boot.soft.in{opacity:1}
#boot svg{display:block;width:min(42vmin,240px);height:min(42vmin,240px);overflow:visible;will-change:transform,opacity;transition:transform 440ms cubic-bezier(.2,.8,.2,1),opacity 380ms cubic-bezier(.2,.8,.2,1)}
#boot .ring{transform-box:view-box;transform-origin:512px 512px}
#boot circle{transform-box:fill-box;transform-origin:center}
#boot .gs{fill:none;stroke:currentColor;stroke-width:3.4;stroke-linejoin:round;stroke-dasharray:1 1}
#boot.out{background-color:transparent;pointer-events:none}
#boot.out svg{transform:scale(1.08);opacity:0}
#boot.rm,#boot.rm svg{transition:opacity 320ms linear!important}#boot.rm.out svg{transform:none}
body.boot main{opacity:0;filter:blur(10px)}body.boot #nav,body.boot .fab{opacity:0}
body.unboot main,body.unboot #nav,body.unboot .fab{transition:opacity 640ms var(--e),filter 760ms var(--e)}

/* brand mark (Settings footer) */
.brand{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 0 6px;color:var(--fg)}
.brand svg{width:58px;height:58px;overflow:visible}
.brand .mono{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3)}
.steps{padding-left:20px}.steps li{margin:0 0 6px}
</style>

  }
  if (D.rdone) {

  }
  if (D.day != null) { syncRoutineForm(); const d = +D.day, i = form.days.indexOf(d); i < 0 ? form.days.push(d) : form.days.splice(i, 1); t.classList.toggle('on', i < 0); return; }

    const i = data.routines.findIndex(x => x.id === o.id); i < 0 ? data.routines.push(o) : data.routines[i] = o;

  }
  if ('delm' in D) { delReminder(form.id); return; }
  if (t.id === 'perm') { askPerm(); return; }
  if (t.id === 'testn') { notify({ key: 'test-' + Date.now(), title: 'Routines', body: 'Notifications are working.' }); return; }
  if (t.id === 'exp') { exportData(); return; }
  if (t.id === 'imp') { $('#file').click(); return; }
  if (t.id === 'reset') { confirmDlg('Reset everything?', 'All routines, reminders and ticks will be replaced with the three examples.', 'Reset', true).then(ok => { if (ok) { data = seed(); save(); render(true); resync(); } }); return; }
});

  if (ev.target.id === 'pfile') {

/* escape + hardware back: dialog -> sheet -> Today -> exit */
function backStep() {
  if (dlgRes) { closeDialog(false); return true; }

if (isNative) {
  const P = window.Capacitor.Plugins;
  // A registered backButton listener stops the native default (exit); the actual handling runs on the
  // document 'backbutton' event, which Capacitor fires reliably even when the early plugin callback is dropped.
  let lastBack = 0;
  const onBack = () => { const n = Date.now(); if (n - lastBack < 250) return; lastBack = n; if (!backStep()) { try { P.App.exitApp(); } catch (e) {} } };
  try { P.App && P.App.addListener('backButton', onBack); } catch (e) {}
  document.addEventListener('backbutton', onBack);
  try { if (P.StatusBar) { P.StatusBar.setStyle({ style: 'DARK' }); P.StatusBar.setBackgroundColor({ color: '#000000' }); } } catch (e) {}   // launch overlay is black; themed on reveal
}

/* ---------- OTA web-bundle updates (self-hosted, @capgo/capacitor-updater manual mode) ---------- */
function vcmp(a, b) {   // compare dotted versions numerically; non-numeric (e.g. 'builtin') sorts lowest
  const p = v => String(v || '').split('.').map(n => parseInt(n, 10));
  const x = p(a), y = p(b);
  for (let i = 0; i < Math.max(x.length, y.length); i++) {
    const m = x[i] || 0, n = y[i] || 0;
    if (isNaN(m) || isNaN(n)) return isNaN(m) ? (isNaN(n) ? 0 : -1) : 1;
    if (m !== n) return m > n ? 1 : -1;
  }
  return 0;
}
async function otaCheck() {
  const U = window.Capacitor.Plugins.CapacitorUpdater;
  if (!U) return;
  try { await U.notifyAppReady(); } catch (e) {}   // must run every launch or the bundle is rolled back
  try {
    const cur = await U.current();
    const b = cur && cur.bundle;
    // A bundle queued by next() is normally applied when the app is backgrounded; if the app was killed
    // in the foreground instead, apply it now on cold launch.
    // Only ever move forward: APP_VERSION is the version of the bundle that is running right now.
    try { const nx = await U.getNextBundle(); if (nx && nx.id && b && nx.id !== b.id && nx.status !== 'error' && vcmp(nx.version, APP_VERSION) > 0) { await U.set({ id: nx.id }); return; } } catch (e) {}
    const r = await fetch(OTA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (!j || !j.version || !j.url || vcmp(j.version, APP_VERSION) <= 0) return;
    let nb = null;
    try { const l = await U.list(); nb = (l.bundles || []).find(x => x.version === j.version && x.status !== 'error') || null; } catch (e) {}
    if (!nb) nb = await U.download({ url: j.url, version: j.version, checksum: j.checksum || '' });
    if (!nb || !nb.id) return;
    await U.next({ id: nb.id });
    otaToast(U, nb.id);
  } catch (e) { /* silent */ }
}
function otaToast(U, id) {
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = '<span>Update ready — restart to apply</span><button class="btn pri">Restart now</button>';
  t.querySelector('button').addEventListener('click', () => { U.set({ id }).catch(() => {}); });
  document.body.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('on')));
  setTimeout(() => t.classList.remove('on'), 12000);
}
